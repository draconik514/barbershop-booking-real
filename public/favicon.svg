<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#1a1a2e"/>
  <!-- Scissors body -->
  <!-- Blade 1 -->
  <line x1="16" y1="16" x2="26" y2="7" stroke="#e94560" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="26" y2="25" stroke="#e94560" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Blade 2 -->
  <line x1="16" y1="16" x2="8" y2="9" stroke="#e94560" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="8" y2="23" stroke="#e94560" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Handle rings -->
  <circle cx="7" cy="8.5" r="3" stroke="#e94560" stroke-width="1.8" fill="none"/>
  <circle cx="7" cy="23.5" r="3" stroke="#e94560" stroke-width="1.8" fill="none"/>
  <!-- Center pivot -->
  <circle cx="16" cy="16" r="1.8" fill="#e94560"/>
</svg>
